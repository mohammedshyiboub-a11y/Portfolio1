<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Mohamed Shyiboub Ahmed – UI/UX Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0D12;--bg2:#11151D;--card:#161B25;--a:#4F8CFF;--a2:#8B7CFF;--tx:#F5F7FA;--tx2:#9BA4B5;--bd:#252D3A;--r:10px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:400 16px/1.7 Inter,"IBM Plex Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(11,13,18,.92);z-index:60}
[dir=rtl] body,[dir=rtl] button{font-family:"IBM Plex Sans Arabic",Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--a);outline-offset:3px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:"Space Grotesk","IBM Plex Sans Arabic",sans-serif;margin:0;line-height:1.15;letter-spacing:-.02em}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{font-family:"IBM Plex Sans Arabic",sans-serif;letter-spacing:0;line-height:1.35}
p{margin:0}
/* nav */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(11,13,18,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{font:700 18px "Space Grotesk",sans-serif;display:flex;align-items:center;gap:10px}
.logo i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;font:700 13px Inter,sans-serif;font-style:normal;color:#08101f}
.links{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.links a{position:relative;display:block;padding:8px 12px;border-radius:8px;color:var(--tx2);font-size:14px;font-weight:500;transition:color .2s,background .2s}
.links a:hover,.links a.on{color:var(--tx);background:var(--card)}
.tools{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 16px;border-radius:8px;font:500 14px inherit;cursor:pointer;transition:border-color .2s,transform .2s,background .2s}
.btn:hover{border-color:var(--a)}
.btn.pri{background:var(--a);border-color:var(--a);color:#07111f;font-weight:600}
.btn.pri:hover{background:#6a9dff;box-shadow:0 0 24px rgba(79,140,255,.35)}
#menu{display:none}
/* hero */
.hero{position:relative;overflow:hidden;padding:88px 0 72px;background:radial-gradient(700px 380px at 82% 12%,rgba(79,140,255,.12),transparent 70%),radial-gradient(500px 300px at 5% 60%,rgba(139,124,255,.08),transparent 70%)}
.hgrid{display:grid;grid-template-columns:1.25fr .75fr;gap:56px;align-items:center}
.sel{position:relative;display:inline-block;padding:18px 22px;border:1px solid var(--a);margin-inline-start:-22px}
.sel b{position:absolute;width:9px;height:9px;background:var(--bg);border:1.5px solid var(--a)}
.sel b:nth-child(1){top:-5px;left:-5px}.sel b:nth-child(2){top:-5px;right:-5px}.sel b:nth-child(3){bottom:-5px;left:-5px}.sel b:nth-child(4){bottom:-5px;right:-5px}
.sel em{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:10px;background:var(--a);color:#07111f;font:600 11px Inter,sans-serif;font-style:normal;padding:2px 8px;border-radius:4px;white-space:nowrap}
.hero h1{font-size:clamp(38px,6.2vw,68px);font-weight:700}
.role{margin-top:44px;font:500 clamp(19px,2.4vw,26px) "Space Grotesk","IBM Plex Sans Arabic",sans-serif;color:var(--a)}
.lead{margin-top:16px;color:var(--tx2);max-width:560px;font-size:17px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
/* sections */
section{padding:88px 0}
section.alt{background:var(--bg2);border-block:1px solid var(--bd)}
.sh{margin-bottom:44px;max-width:620px}
.sh h2{font-size:clamp(28px,4vw,40px)}
.sh p{margin-top:12px;color:var(--tx2)}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:26px;transition:border-color .25s}
.card:hover{border-color:rgba(79,140,255,.55)}
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:40px}
.about p{color:var(--tx2);font-size:17px}
.facts{display:grid;gap:12px;align-content:start}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--bd);font-size:15px}
.facts span{color:var(--tx2)}
/* timeline */
.tl{position:relative;display:grid;gap:20px;padding-inline-start:30px}
.tl::before{content:"";position:absolute;inset-block:6px;inset-inline-start:5px;width:1px;background:linear-gradient(var(--a),var(--bd) 70%)}
.tl .card{position:relative}
.tl .card::before{content:"";position:absolute;inset-inline-start:-30px;top:30px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--a)}
.tl .card.now::before{background:var(--a);box-shadow:0 0 12px var(--a)}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;color:var(--tx2);font-size:14px;margin:6px 0 10px}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:6px;padding:1px 9px;font-size:13px;color:var(--a)}
.card h3{font-size:19px}
.card p{color:var(--tx2);font-size:15px}
.cols{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
/* projects */
.proj{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.proj .card{padding:0;overflow:hidden;display:flex;flex-direction:column}
.cover{height:190px;display:grid;place-items:center;border-bottom:1px solid var(--bd);position:relative;background:linear-gradient(135deg,#141b2b,#1a1840)}
.cover span{font:700 46px "Space Grotesk",sans-serif;letter-spacing:-.03em}
.cover i{position:absolute;width:62px;height:112px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg)}
.cover i:nth-of-type(1){transform:translateX(-96px) rotate(-6deg)}.cover i:nth-of-type(2){transform:translateX(96px) rotate(6deg)}
.cover span{position:relative;z-index:1;background:var(--bg);border:1px solid var(--bd);padding:8px 22px;border-radius:10px}
.pb{padding:24px;display:flex;flex-direction:column;gap:10px;flex:1}
.pb .btn{align-self:flex-start;margin-top:auto}
/* skills */
.sk{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips span{padding:5px 12px;border:1px solid var(--bd);border-radius:7px;background:var(--bg2);font-size:14px;transition:border-color .2s,color .2s}
.chips span:hover{border-color:var(--a);color:var(--a)}
/* achievement */
.ach{display:flex;gap:22px;align-items:center;border-color:rgba(139,124,255,.5);background:linear-gradient(120deg,rgba(139,124,255,.12),var(--card) 60%);margin-bottom:24px}
.ach strong{font:700 44px "Space Grotesk",sans-serif;color:var(--a2);line-height:1}
/* contact */
.cg{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.cg a.card,.cg div.card{display:flex;align-items:center;gap:14px}
.cg .tx{min-width:0}
.ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(79,140,255,.18),rgba(139,124,255,.18));color:var(--a);transition:.25s}
.ic svg{width:22px;height:22px}
.cg a.card:hover .ic{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;transform:translateY(-2px)}
.cvw{display:flex;justify-content:center;margin:24px 0}
.cvb{display:inline-flex;align-items:center;gap:10px;padding:14px 28px}
.cg small{display:block;color:var(--tx2);font-size:13px;margin-bottom:2px}
.cg b{font-weight:500;word-break:break-word}
.fm{margin-top:16px;display:grid;gap:14px}.fm h3{font-size:22px}.fm .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fm label{display:grid;gap:6px;font-size:14px;color:var(--tx2)}.fm input,.fm textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;color:var(--tx);font:inherit;transition:border-color .2s,box-shadow .2s}.fm input:focus,.fm textarea:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(79,140,255,.18)}.fm textarea{min-height:140px;resize:vertical}#fst{font-size:14px;color:var(--tx2)}@media(max-width:860px){.fm .row{grid-template-columns:1fr}}
footer{padding:28px 0;border-top:1px solid var(--bd);color:var(--tx2);font-size:14px}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:2px;z-index:70;background:linear-gradient(90deg,var(--a),var(--a2));transform-origin:0 50%;transform:scaleX(0)}
.hgrid{position:relative;z-index:1}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.28;pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
.o1{width:380px;height:380px;background:var(--a);top:-100px;right:-80px}.o2{width:320px;height:320px;background:var(--a2);bottom:-120px;left:8%;animation-duration:19s}
@keyframes drift{to{transform:translate(-70px,60px) scale(1.18)}}
@keyframes up{from{opacity:0;transform:translateY(28px)}}
@keyframes fade{from{opacity:0}}
@keyframes frame{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(-14px -14px -44px -14px)}}
@keyframes pop{from{transform:scale(0)}}
.sel{animation:frame 1s .1s cubic-bezier(.6,0,.2,1) both}.sel b{animation:pop .4s 1s both}.sel em{animation:fade .6s 1.25s both}
.hero h1{animation:up .9s .35s cubic-bezier(.2,.7,.2,1) both}.role{animation:up .9s .55s both}.lead{animation:up .9s .8s both}.cta{animation:up .9s .95s both}
.rot{margin-top:6px;height:30px;overflow:hidden;color:var(--tx2);font-size:17px;animation:fade 1s 1.1s both}
#rot{display:block;animation:rt .6s both}@keyframes rt{from{opacity:0;transform:translateY(100%)}}
.mq{overflow:hidden;padding:18px 0;background:var(--bg2);border-block:1px solid var(--bd);display:grid;gap:12px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mt{display:flex;gap:12px;width:max-content;animation:mq 26s linear infinite!important}#m2{animation-duration:32s!important}.mt span{transition:transform .25s,border-color .25s,color .25s}.mt span:hover{transform:translateY(-3px) scale(1.06);border-color:var(--a);color:var(--tx)}.mt.rv2{animation-direction:reverse}.mq:hover .mt{animation-play-state:paused}
.mt span{padding:8px 20px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx2);font-size:15px;white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
.stb{padding:0 0 88px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.stats div{position:relative;padding-inline-start:18px}
.stats div::before,.stats div::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:2px}
.stats div::before{background:var(--bd)}
.stats div::after{background:linear-gradient(to top,var(--a),var(--a2));transform:scaleY(0);transform-origin:bottom;transition:transform 2s cubic-bezier(.215,.61,.355,1)}
.stats div.go::after{transform:scaleY(1)}.stats b{display:block;font:700 clamp(34px,5vw,52px) "Space Grotesk",sans-serif;line-height:1.1}.stats div>span{color:var(--tx2);font-size:14px}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),rgba(79,140,255,.13),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}.card:hover::after{opacity:1}
.links a::after{content:"";position:absolute;inset-inline:12px;bottom:3px;height:2px;background:var(--a);transform:scaleX(0);transition:transform .3s}.links a.on::after,.links a:hover::after{transform:scaleX(1)}
.btn.pri{position:relative;overflow:hidden}.btn.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-130%);transition:transform .7s}.btn.pri:hover::after{transform:translateX(130%)}
.tl::before{transform-origin:top;transform:scaleY(0);transition:transform 1.8s ease}.tl.in::before{transform:none}
.shot{display:block;position:relative;aspect-ratio:16/9;overflow:hidden;border-bottom:1px solid var(--bd);background:#000}
.shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.3s cubic-bezier(.2,.7,.2,1)}.proj .card:hover .shot img{transform:scale(1.08)}
.vw{position:absolute;inset-inline-end:14px;bottom:14px;background:var(--a);color:#07111f;font:600 13px Inter,"IBM Plex Sans Arabic",sans-serif;padding:6px 13px;border-radius:7px;opacity:0;transform:translateY(8px);transition:.35s}.shot:hover .vw{opacity:1;transform:none}
.proj .card.in{transition:transform .18s ease-out,border-color .25s}
@media(max-width:560px){.stats{gap:10px}.stats div{padding-inline-start:10px}}
.rv{opacity:0;transform:translateY(14px);transition:opacity .7s,transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media(max-width:860px){
 .links{display:none;position:absolute;inset-inline:0;top:64px;flex-direction:column;background:var(--bg2);border-bottom:1px solid var(--bd);padding:12px 24px}
 .links.open{display:flex}#menu{display:inline-flex}
 .hgrid,.about,.cols,.proj,.sk,.cg{grid-template-columns:1fr}
 .photo{max-width:260px;order:-1;justify-self:start}
 .hero{padding-top:56px}section{padding:64px 0}
 .ach{flex-direction:column;align-items:flex-start}
}

/* ===== WOW animations ===== */
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero h1{background:linear-gradient(100deg,var(--tx) 20%,#7fb0ff 40%,var(--a2) 55%,var(--tx) 75%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:up .9s .35s cubic-bezier(.2,.7,.2,1) both,shine 6s 1.4s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.cur{position:fixed;left:0;top:0;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:radial-gradient(circle,rgba(79,140,255,.16),rgba(139,124,255,.07) 45%,transparent 70%);pointer-events:none;z-index:0;opacity:0;transition:opacity .4s;will-change:transform}
.cur.on{opacity:1}
.sh h2{position:relative;display:inline-block}
.sh h2::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--a),var(--a2));transform:scaleX(0);transform-origin:left;transition:transform .9s .25s cubic-bezier(.2,.7,.2,1)}
[dir=rtl] .sh h2::after{transform-origin:right}
.sh.rv.in h2::after,.sh h2.in::after{transform:scaleX(1)}
.btn.pri{position:relative;overflow:hidden}
.btn.pri::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:swp 3.6s 2s infinite}
@keyframes swp{0%{left:-60%}35%,100%{left:140%}}
.btn{will-change:transform}
.ic{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(79,140,255,.0)}50%{box-shadow:0 0 0 8px rgba(79,140,255,.12)}}
.curtain{position:fixed;inset:0;z-index:999;pointer-events:none;display:flex;flex-direction:column}
.curtain i{flex:1;background:#080a0f;transition:transform 1s cubic-bezier(.77,0,.18,1)}
.curtain b{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(28px,6vw,56px)/1 "Space Grotesk",sans-serif;letter-spacing:.04em;background:linear-gradient(100deg,#fff,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;transition:opacity .45s,transform .6s;animation:fade .5s both}
.curtain.go i:first-child{transform:translateY(-101%)}.curtain.go i:last-child{transform:translateY(101%)}
.curtain.go b{opacity:0;transform:scale(1.15)}
@media(pointer:coarse){.cur{display:none}}

/* ===== circular photo + polish ===== */
.chips span{opacity:0;transform:scale(.7) translateY(8px)}
.card.in .chips span,.in .chips span{animation:chipin .55s cubic-bezier(.2,.9,.3,1.3) forwards}
.chips span:nth-child(1){animation-delay:.1s!important}.chips span:nth-child(2){animation-delay:.18s!important}.chips span:nth-child(3){animation-delay:.26s!important}.chips span:nth-child(4){animation-delay:.34s!important}.chips span:nth-child(5){animation-delay:.42s!important}.chips span:nth-child(6){animation-delay:.5s!important}.chips span:nth-child(7){animation-delay:.58s!important}.chips span:nth-child(8){animation-delay:.66s!important}
@keyframes chipin{to{opacity:1;transform:none}}
.chips span:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(79,140,255,.2)}
.tl .card.now::before{animation:dotp 2s ease-in-out infinite}
@keyframes dotp{50%{box-shadow:0 0 0 7px rgba(79,140,255,.0),0 0 22px var(--a);transform:scale(1.25)}}
.tl .card:hover{border-color:rgba(79,140,255,.45);transform:translateX(4px)}
[dir=rtl] .tl .card:hover{transform:translateX(-4px)}
.ach{position:relative;overflow:hidden}
.ach::after{content:"";position:absolute;top:0;left:-40%;width:30%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-20deg);animation:swp 5s 1s infinite}

/* ===== photo: tilted frame + floating chips + soft animated aura ===== */
.photo{position:relative;justify-self:center;width:100%;max-width:340px;animation:ph 1s .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes ph{from{opacity:0;transform:translateY(16px)}}
.photo::before{content:"";position:absolute;inset:-14px;border:1px solid rgba(139,150,255,.22);border-radius:22px;transform:rotate(2.5deg);z-index:1;pointer-events:none;animation:bob 4.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(2.5deg) translateY(12px)}50%{transform:rotate(2.5deg) translateY(-16px)}}
.photo img{position:relative;z-index:2;display:block;width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 20%;border-radius:20px;border:1px solid var(--bd);box-shadow:0 24px 60px -20px rgba(0,0,0,.6)}
.aura{position:absolute;inset:0;z-index:0;pointer-events:none}
.aura i{position:absolute;border-radius:50%;filter:blur(46px)}
.aura .g1{width:70%;height:70%;left:-18%;top:-14%;background:var(--a);opacity:.34;animation:breathe 7s ease-in-out infinite}
.aura .g2{width:64%;height:64%;right:-16%;bottom:-14%;background:var(--a2);opacity:.34;animation:breathe 9s -3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(26px) scale(.95);opacity:.25}50%{transform:translateY(-30px) scale(1.12);opacity:.5}}
.fl{position:absolute;z-index:3;padding:6px 14px;background:rgba(22,27,37,.88);border:1px solid var(--bd);border-radius:10px;font-size:13px;font-weight:500;backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.35);animation:flt 3.6s ease-in-out infinite alternate}
@keyframes flt{from{transform:translateY(6px)}to{transform:translateY(-12px)}}
@media(max-width:560px){.photo::before{inset:-10px}.fl{font-size:12px;padding:5px 11px}}
@media(prefers-reduced-motion:reduce){.aura i,.fl,.photo::before{animation:none!important}}

/* ===== counting numbers ===== */
.stats b,.tag .cn,.ach strong span{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.stats b{display:block}
.tag .cn{font-variant-numeric:tabular-nums}
.ach strong{color:var(--a2);display:flex;align-items:flex-start;gap:2px}
.ach strong sup{font-size:.42em;font-weight:600;margin-top:.1em}
@media(prefers-reduced-motion:reduce){.curtain,.cur,#fx{display:none}*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}

/* skills: chip style like the marquee */
.sk{display:block;max-width:1000px}
.skr{padding:22px 0;border-bottom:1px solid var(--bd)}
.skr:last-child{border-bottom:0}
.skr h3{margin:0 0 14px;font-size:1.1rem}
.skc{display:flex;flex-wrap:wrap;gap:12px}
.skc span{padding:8px 20px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx2);font-size:15px;transition:border-color .2s,color .2s,transform .2s,box-shadow .2s}
.skc span:hover{border-color:var(--a);color:var(--tx);transform:translateY(-3px);box-shadow:0 6px 18px rgba(79,140,255,.2)}
@media (max-width:640px){.skr{padding:18px 0}.skc{gap:10px}.skc span{padding:7px 14px;font-size:14px}}
</style>
</head>
